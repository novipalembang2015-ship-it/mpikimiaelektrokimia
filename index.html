<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Modul Elektrokimia | SMA Negeri 5 Palembang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a2258;
  --blue-deep:#0f3a8f;
  --blue:#1a56d6;
  --blue-bright:#2f7bf6;
  --blue-pale:#eaf1ff;
  --blue-mist:#f4f8ff;
  --ice:#ffffff;
  --ink:#0b1a3a;
  --ink-soft:#4a5a80;
  --line:#d7e3fb;
  --good:#0f8f5f;
  --good-bg:#e7f8f0;
  --warn:#b3550c;
  --warn-bg:#fff1e6;
  --l1:#2f7bf6;
  --l2:#0f3a8f;
  --l3:#0a2258;
  --radius:18px;
  --shadow: 0 12px 32px -12px rgba(10,34,88,.28);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Manrope',sans-serif;
  color:var(--ink);
  background:var(--blue-mist);
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
p{line-height:1.65;}
button{font-family:inherit;cursor:pointer;}
img,svg{max-width:100%;}

/* ---------- topbar ---------- */
#topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(120deg,var(--navy),var(--blue-deep) 65%,var(--blue));
  color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px;
  box-shadow:0 6px 20px -8px rgba(10,34,88,.5);
}
#topbar .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
#topbar .brand .mark{
  width:38px;height:38px;border-radius:11px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;border:1px solid rgba(255,255,255,.3);
  overflow:hidden;padding:2px;
}
#topbar .brand .mark img{width:100%;height:100%;object-fit:contain;}
#topbar .brand .txt{line-height:1.15;}
#topbar .brand .txt small{display:block;font-size:11px;opacity:.75;letter-spacing:.02em;}
#topbar .brand .txt strong{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
#navToggle{display:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:8px 10px;}

#navMenu{display:flex;gap:4px;flex-wrap:wrap;}
#navMenu button{
  background:transparent;border:none;color:rgba(255,255,255,.82);
  padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;
  transition:background .2s, color .2s;
  white-space:nowrap;
}
#navMenu button:hover{background:rgba(255,255,255,.12);color:#fff;}
#navMenu button.active{background:#fff;color:var(--blue-deep);}

/* ---------- layout ---------- */
#stage{max-width:1040px;margin:0 auto;padding:34px 22px 80px;}
.section{animation:riseIn .45s ease both;}
@keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){.section{animation:none;}}

.eyebrow-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--blue-pale);color:var(--blue-deep);
  padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;
  margin-bottom:14px;
}
.page-title{font-size:clamp(26px,4vw,38px);font-weight:600;margin:0 0 10px;color:var(--navy);}
.page-sub{color:var(--ink-soft);font-size:16px;max-width:640px;margin:0 0 28px;}

.card{
  background:var(--ice);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 28px;box-shadow:var(--shadow);
}

/* ---------- HOME ---------- */
.hero{
  background:radial-gradient(circle at 20% 20%, rgba(255,255,255,.14), transparent 45%),
             linear-gradient(135deg,var(--navy) 0%,var(--blue-deep) 55%,var(--blue) 100%);
  color:#fff;border-radius:26px;padding:56px 44px;position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.hero::after{
  content:"";position:absolute;right:-60px;bottom:-80px;width:280px;height:280px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);
}
.hero .school{font-size:13px;letter-spacing:.04em;color:rgba(255,255,255,.75);margin-bottom:16px;font-weight:600;}
.hero-logo{width:64px;height:auto;margin-bottom:16px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:600;margin:0 0 14px;line-height:1.12;max-width:620px;}
.hero p.lead{color:rgba(255,255,255,.85);max-width:520px;font-size:16.5px;margin:0 0 26px;}
.hero .meta{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:30px;font-size:14px;color:rgba(255,255,255,.8);}
.hero .meta b{color:#fff;display:block;font-size:13px;font-weight:700;}
.hero .cta{
  background:#fff;color:var(--blue-deep);border:none;padding:14px 26px;border-radius:12px;
  font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:10px;
  box-shadow:0 10px 24px -8px rgba(0,0,0,.35);
}
.hero .cta:hover{background:var(--blue-pale);}

.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px;}
@media(max-width:760px){.menu-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.menu-grid{grid-template-columns:1fr;}}
.menu-card{
  background:var(--ice);border:1px solid var(--line);border-radius:16px;padding:22px 20px;
  text-align:left;transition:transform .18s, box-shadow .18s, border-color .18s;
  display:flex;flex-direction:column;gap:10px;
}
.menu-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--blue-bright);}
.menu-card .ic{
  width:44px;height:44px;border-radius:12px;background:var(--blue-pale);color:var(--blue-deep);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.menu-card h3{margin:0;font-size:17px;color:var(--navy);}
.menu-card span{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}

/* ---------- TUJUAN ---------- */
.tp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;}
.tp-list li{
  display:flex;gap:16px;background:var(--ice);border:1px solid var(--line);
  border-radius:14px;padding:18px 20px;align-items:flex-start;
}
.tp-num{
  flex:none;width:34px;height:34px;border-radius:10px;background:var(--blue-deep);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
}
.tp-list p{margin:0;color:var(--ink);font-size:15.5px;}

/* ---------- MATERI ---------- */
.materi-shell{display:grid;grid-template-columns:230px 1fr;gap:26px;}
@media(max-width:760px){.materi-shell{grid-template-columns:1fr;}}
.materi-side{display:flex;flex-direction:column;gap:8px;}
.materi-side button{
  text-align:left;background:var(--ice);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;font-size:14px;font-weight:600;color:var(--ink-soft);
  display:flex;gap:10px;align-items:center;
}
.materi-side button .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;}
.materi-side button.active{background:var(--blue-deep);color:#fff;border-color:var(--blue-deep);}
.materi-side button.active .dot{background:#fff;}
.materi-body h2{color:var(--navy);margin-top:0;font-size:24px;}
.materi-body .tag{
  display:inline-block;background:var(--blue-pale);color:var(--blue-deep);font-size:12.5px;font-weight:700;
  padding:4px 12px;border-radius:999px;margin-bottom:12px;
}
.materi-body h4{color:var(--blue-deep);font-size:15.5px;margin:22px 0 8px;}
.triplet-cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:-4px 0 20px;}
.triplet-cap-grid .cap{border-radius:0 0 12px 12px;padding:12px 14px;font-size:13.5px;line-height:1.55;color:var(--ink);}
.triplet-cap-grid .cap b{display:block;font-size:11.5px;letter-spacing:.03em;margin-bottom:6px;text-transform:uppercase;}
.triplet-cap-grid .cap-makro{background:var(--blue-pale);border-top:4px solid var(--navy);}
.triplet-cap-grid .cap-makro b{color:var(--navy);}
.triplet-cap-grid .cap-sub{background:var(--blue-mist);border-top:4px solid var(--blue-deep);}
.triplet-cap-grid .cap-sub b{color:var(--blue-deep);}
.triplet-cap-grid .cap-simb{background:var(--blue-pale);border-top:4px solid var(--blue-bright);}
.triplet-cap-grid .cap-simb b{color:var(--blue-bright);}
@media(max-width:700px){.triplet-cap-grid{grid-template-columns:1fr;}}
.materi-body ul, .materi-body ol{padding-left:20px;color:var(--ink);font-size:15px;}
.materi-body ul li, .materi-body ol li{margin-bottom:6px;line-height:1.6;}
.formula{
  background:var(--blue-pale);border-left:4px solid var(--blue-deep);border-radius:0 10px 10px 0;
  padding:12px 16px;margin:14px 0;font-size:15px;color:var(--navy);font-weight:600;
}
.compare-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14.5px;}
.compare-table th,.compare-table td{border:1px solid var(--line);padding:10px 12px;text-align:left;}
.compare-table th{background:var(--blue-deep);color:#fff;}
.compare-table tr:nth-child(even) td{background:var(--blue-mist);}
.nav-buttons{display:flex;justify-content:space-between;margin-top:28px;gap:10px;}
.btn{
  border:none;padding:12px 20px;border-radius:11px;font-weight:700;font-size:14.5px;
  display:inline-flex;align-items:center;gap:8px;
}
.btn-primary{background:var(--blue-deep);color:#fff;}
.btn-primary:hover{background:var(--navy);}
.btn-ghost{background:var(--ice);color:var(--blue-deep);border:1px solid var(--line) !important;}
.btn-ghost:hover{background:var(--blue-pale);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- SIMULASI ---------- */
.sim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
@media(max-width:700px){.sim-grid{grid-template-columns:1fr;}}
.sim-card{background:var(--ice);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);}
.sim-card .kind{font-size:12px;font-weight:700;color:var(--blue-deep);background:var(--blue-pale);display:inline-block;padding:3px 10px;border-radius:999px;margin-bottom:10px;}
.sim-card h3{margin:0 0 8px;color:var(--navy);font-size:17px;}
.sim-card p{font-size:14px;color:var(--ink-soft);margin:0 0 16px;}
.sim-card a.btn-primary{text-decoration:none;}

/* ---------- QUIZ (Latihan & Asesmen) ---------- */
.quiz-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
.progress-track{flex:1;min-width:160px;height:8px;background:var(--blue-pale);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-deep));border-radius:99px;transition:width .3s;}
.level-chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;color:#fff;}
.stimulus-box{background:var(--blue-mist);border:1px dashed var(--blue-bright);border-radius:14px;padding:16px 18px;margin-bottom:18px;font-size:14.5px;color:var(--ink);}
.stimulus-box .st-label{font-size:12px;font-weight:700;color:var(--blue-deep);text-transform:none;margin-bottom:6px;display:block;}
.q-prompt{font-size:16.5px;font-weight:700;color:var(--navy);margin:0 0 16px;line-height:1.5;}
.opt-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.opt-item{
  border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;gap:12px;align-items:flex-start;
  transition:border-color .15s, background .15s; font-size:14.5px;
}
.opt-item:hover{border-color:var(--blue-bright);}
.opt-item input{margin-top:3px;flex:none;}
.opt-item.correct-mark{border-color:var(--good);background:var(--good-bg);}
.opt-item.wrong-mark{border-color:#c94a3f;background:#fdecea;}
.cat-stmt{border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;}
.cat-stmt p{margin:0 0 10px;font-size:14.5px;color:var(--ink);font-weight:600;}
.cat-choices{display:flex;gap:10px;}
.cat-choices label{
  flex:1;text-align:center;border:1.5px solid var(--line);border-radius:9px;padding:8px 6px;font-size:13.5px;font-weight:700;color:var(--ink-soft);
}
.cat-choices input{margin-right:6px;}
.feedback-box{border-radius:14px;padding:16px 18px;margin:16px 0;font-size:14.5px;line-height:1.6;}
.feedback-box.good{background:var(--good-bg);border:1px solid var(--good);color:#0a5c3e;}
.feedback-box.bad{background:var(--warn-bg);border:1px solid var(--warn);color:#7a3b06;}
.feedback-box strong{display:block;font-size:15.5px;margin-bottom:6px;}
.check-btn{background:var(--blue-deep);color:#fff;}
.result-hero{
  text-align:center;padding:40px 20px;background:linear-gradient(135deg,var(--navy),var(--blue-deep));
  color:#fff;border-radius:20px;
}
.result-hero .score{font-family:'Fraunces',serif;font-size:56px;font-weight:600;margin:8px 0;}

/* ---------- Asesmen intro / student form ---------- */
.form-row{margin-bottom:16px;}
.form-row label{display:block;font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:6px;}
.form-row input, .form-row select{
  width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;
  background:#fff;color:var(--ink);
}
.form-row input:focus, .form-row select:focus{outline:none;border-color:var(--blue-bright);}

.recap-toggle{background:none;border:1px solid var(--line);color:var(--blue-deep);border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:700;margin-top:10px;}
table.recap-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px;}
table.recap-table th,table.recap-table td{border:1px solid var(--line);padding:8px 10px;text-align:left;}
table.recap-table th{background:var(--blue-deep);color:#fff;}

.reflect-card{background:var(--ice);border:1px solid var(--line);border-left:5px solid var(--blue-bright);border-radius:14px;padding:16px 20px;margin-bottom:12px;}
.reflect-card .rf-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.reflect-card .rf-name{font-weight:700;color:var(--navy);font-size:14.5px;}
.reflect-card .rf-meta{font-size:12.5px;color:var(--ink-soft);}
.reflect-card p.rf-text{margin:0;font-size:14.5px;color:var(--ink);line-height:1.6;}
.reflect-note{font-size:12.5px;color:var(--ink-soft);background:var(--blue-pale);border-radius:10px;padding:10px 14px;margin:14px 0 20px;}
textarea.rf-textarea{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;min-height:110px;resize:vertical;}
textarea.rf-textarea:focus{outline:none;border-color:var(--blue-bright);}

/* ---------- rangkuman ---------- */
.rangkuman-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
@media(max-width:700px){.rangkuman-grid{grid-template-columns:1fr;}}
.rk-card{background:var(--ice);border:1px solid var(--line);border-left:5px solid var(--blue-deep);border-radius:14px;padding:20px 22px;}
.rk-card h4{margin:0 0 8px;color:var(--navy);}
.rk-card p, .rk-card li{font-size:14.5px;color:var(--ink-soft);}

footer.app-footer{text-align:center;padding:26px;color:var(--ink-soft);font-size:13px;}

@media(max-width:760px){
  #navMenu{display:none;position:absolute;top:64px;left:0;right:0;background:var(--navy);flex-direction:column;padding:10px;border-radius:0 0 14px 14px;}
  #navMenu.open{display:flex;}
  #navToggle{display:block;}
}
</style>
</head>

<div id="topbar">
  <div class="brand" onclick="goHome()">
    <div class="mark" id="topbarMark">⚡</div>

  </div>
  <nav id="navMenu"></nav>
  <button id="navToggle" onclick="document.getElementById('navMenu').classList.toggle('open')">☰</button>
</div>

<div id="stage"></div>

<footer class="app-footer">Disusun oleh Novitalia Ablinda Sari, S.T., M.Pd &mdash; SMA Negeri 5 Palembang &copy; 2026</footer>

  title:'Konsep Dasar Reaksi Redoks dan Sel Elektrokimia',
  body:`
  <p>Elektrokimia adalah cabang ilmu kimia yang mempelajari hubungan antara reaksi <b>reduksi-oksidasi (redoks)</b> dengan energi listrik. Reaksi redoks selalu melibatkan perpindahan elektron antara dua spesi kimia.</p>
  <h4>Oksidasi dan Reduksi</h4>
  <ul>
    <li><b>Oksidasi</b>: pelepasan elektron oleh suatu zat, ditandai dengan kenaikan bilangan oksidasi (biloks).</li>

  const nav = document.getElementById('navMenu');

function goTo(id){ state.section=id; render(); window.scrollTo({top:0,behavior:'smooth'}); document.getElementById('navMenu').classList.remove('open'); }

  if(state.section==='materi') return renderMateri();
  if(state.section==='simulasi') return renderSimulasi();
  if(state.section==='latihan') return renderLatihan();
  if(state.section==='asesmen') return renderAsesmen();
  if(state.section==='rangkuman') return renderRangkuman();

}

function levelColor(level){
  if(level==='Unistructural') return '#2f7bf6';
  if(level==='Multistructural') return '#0f3a8f';
  if(level==='Relational') return '#0a2258';
  return '#5b0a58';
}

  const q = LATIHAN[state.latihanIdx];
  const pct = Math.round((state.latihanIdx)/LATIHAN.length*100);

function renderQuestionBody(q, mode){
  const prefix = mode+'_';
  let stim = q.stimulus ? `<div class="stimulus-box"><span class="st-label">📎 Stimulus</span>${q.stimulus}</div>` : '';
  let body = '';
  if(q.type==='single'){
    body = `<div class="opt-list">` + q.options.map((o,i)=>`
      <label class="opt-item" id="${prefix}opt${i}">
        <input type="radio" name="${prefix}ans" value="${i}">
        <span>${o}</span>
      </label>`).join('') + `</div>`;
  } else if(q.type==='complex'){
    body = `<p style="font-size:13px;color:var(--ink-soft);font-weight:700;margin:-6px 0 12px;">Pilihan ganda kompleks — jawaban benar bisa lebih dari satu.</p><div class="opt-list">` + q.options.map((o,i)=>`
      <label class="opt-item" id="${prefix}opt${i}">
        <input type="checkbox" name="${prefix}ans" value="${i}">
        <span>${o}</span>
      </label>`).join('') + `</div>`;
  } else if(q.type==='category'){
    body = `<p style="font-size:13px;color:var(--ink-soft);font-weight:700;margin:-6px 0 12px;">Pilihan ganda kategori — kategorikan setiap pernyataan.</p>` + q.statements.map((s,i)=>`
      <div class="cat-stmt" id="${prefix}stmt${i}">
        <p>${i+1}. ${s.text}</p>
        <div class="cat-choices">
          <label><input type="radio" name="${prefix}cat${i}" value="1"> ${q.catLabels[0]}</label>
          <label><input type="radio" name="${prefix}cat${i}" value="0"> ${q.catLabels[1]}</label>
        </div>
      </div>`).join('');
  }
  return `${stim}<p class="q-prompt">${q.prompt}</p>${body}`;
}

function checkAnswer(mode){
  const q = mode==='latihan' ? LATIHAN[state.latihanIdx] : ASESMEN[state.asesmenIdx];
  const prefix = mode+'_';
  let isCorrect = false;
  let detail = '';

  if(q.type==='single'){
    const sel = document.querySelector(`input[name="${prefix}ans"]:checked`);
    if(!sel){ alert('Silakan pilih salah satu jawaban terlebih dahulu.'); return; }
    const val = parseInt(sel.value);
    isCorrect = val===q.correct;
    q.options.forEach((o,i)=>{
      const el = document.getElementById(prefix+'opt'+i);
      if(i===q.correct) el.classList.add('correct-mark');
      else if(i===val) el.classList.add('wrong-mark');
    });
  } else if(q.type==='complex'){
    const checks = document.querySelectorAll(`input[name="${prefix}ans"]:checked`);
    if(checks.length===0){ alert('Silakan pilih minimal satu jawaban.'); return; }
    const vals = Array.from(checks).map(c=>parseInt(c.value)).sort((a,b)=>a-b);
    const correctSorted = [...q.correct].sort((a,b)=>a-b);
    isCorrect = JSON.stringify(vals)===JSON.stringify(correctSorted);
    q.options.forEach((o,i)=>{
      const el = document.getElementById(prefix+'opt'+i);
      if(q.correct.includes(i)) el.classList.add('correct-mark');
      else if(vals.includes(i)) el.classList.add('wrong-mark');
    });
  } else if(q.type==='category'){
    let allAnswered = true, allCorrect = true;
    q.statements.forEach((s,i)=>{
      const sel = document.querySelector(`input[name="${prefix}cat${i}"]:checked`);
      if(!sel){ allAnswered=false; return; }
      const val = sel.value==='1';
      const stmtEl = document.getElementById(prefix+'stmt'+i);
      if(val===s.correct){ stmtEl.style.borderColor='var(--good)'; stmtEl.style.background='var(--good-bg)'; }
      else { stmtEl.style.borderColor='#c94a3f'; stmtEl.style.background='#fdecea'; allCorrect=false; }
    });
    if(!allAnswered){ alert('Silakan kategorikan semua pernyataan terlebih dahulu.'); return; }
    isCorrect = allCorrect;
  }

  const fbId = mode==='latihan' ? 'latihanFeedback' : 'asesmenFeedback';
  const fb = document.getElementById(fbId);
  if(isCorrect){
    fb.innerHTML = `<div class="feedback-box good"><strong>👍 Tepat sekali!</strong>${q.explanation}</div>`;
    if(mode==='latihan') state.latihanScore++;
  } else {
    fb.innerHTML = `<div class="feedback-box bad"><strong>💡 Belum tepat, jangan menyerah!</strong>${q.explanation}</div>`;
  }

  if(mode==='latihan'){
    document.getElementById('checkBtnL').style.display='none';
    document.getElementById('nextBtnL').style.display='inline-flex';
    state.latihanAnswered = true;
  } else {
    document.getElementById('checkBtnA').style.display='none';
    document.getElementById('nextBtnA').style.display='inline-flex';
    state.asesmenAnswered = true;
    state.asesmenAnswers[state.asesmenIdx] = {correct:isCorrect, level:q.level};
  }
}

function nextLatihan(){
  if(state.latihanIdx < LATIHAN.length-1){
    state.latihanIdx++;
    renderLatihan();
  } else {
    renderLatihanResult();
  }
}
function renderLatihanResult(){
  const pct = Math.round(state.latihanScore/LATIHAN.length*100);
  stage.innerHTML = `
  <div class="section">
    <div class="result-hero">
      <div style="font-size:14px;opacity:.8;">Hasil Latihan Soal</div>
      <div class="score">${state.latihanScore} / ${LATIHAN.length}</div>
      <div style="font-size:15px;opacity:.9;">Skor kamu: ${pct}%</div>
    </div>
    <div class="nav-buttons" style="margin-top:24px;">
      <button class="btn btn-ghost" onclick="restartLatihan()">↺ Ulangi Latihan</button>
      <button class="btn btn-primary" onclick="goTo('asesmen')">Lanjut ke Asesmen Sumatif →</button>
    </div>
  </div>`;
}
function restartLatihan(){ state.latihanIdx=0; state.latihanScore=0; renderLatihan(); }

/* ---------------- ASESMEN SUMATIF ---------------- */
function renderAsesmen(){
  if(!state.asesmenStarted){
    stage.innerHTML = `

      <div class="card" style="max-width:480px;">
        <div class="form-row"><label>Nama Lengkap</label><input type="text" id="inpNama" placeholder="Ketik nama lengkapmu"></div>
        <div class="form-row"><label>Kelas</label>
          <select id="inpKelas">
            <option value="">— Pilih kelas —</option>
            <option value="X">X</option>
            <option value="XI">XI</option>
            <option value="XII">XII</option>
          </select>
        </div>
        <div class="form-row"><label>Nama Sekolah</label>
          <select id="inpSekolah" onchange="toggleSekolahLain()">
            <option value="">— Pilih sekolah —</option>
            <option value="SMA N 5 Palembang">SMA N 5 Palembang</option>
            <option value="Lain-lain">Lain-lain</option>
          </select>
        </div>
        <div class="form-row" id="rowSekolahLain" style="display:none;"><label>Tulis Nama Sekolah</label><input type="text" id="inpSekolahLain" placeholder="Ketik nama sekolahmu"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="startAsesmen()">Mulai Asesmen →</button>
      </div>
      <div style="margin-top:22px;">
        <button class="recap-toggle" onclick="toggleRecap()">📊 Lihat Rekap Nilai (Guru)</button>
        <div id="recapArea"></div>
      </div>
    </div>`;
    return;
  }
  if(state.asesmenDone){ return renderAsesmenResult(); }

  const q = ASESMEN[state.asesmenIdx];
  const pct = Math.round((state.asesmenIdx)/ASESMEN.length*100);
  const lvlColor = q.level==='L1' ? '#2f7bf6' : (q.level==='L2' ? '#0f3a8f' : '#0a2258');
  stage.innerHTML = `
  <div class="section">
    <span class="eyebrow-badge">📝 Asesmen Sumatif — ${state.student.nama}, Kelas ${state.student.kelas} — ${state.student.sekolah}</span>
    <h1 class="page-title">Soal ${state.asesmenIdx+1} dari ${ASESMEN.length}</h1>
    <div class="card">
      <div class="quiz-top">
        <span class="level-chip" style="background:${lvlColor};">${q.level}</span>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      </div>
      ${renderQuestionBody(q,'asesmen')}
      <div id="asesmenFeedback"></div>
      <div class="nav-buttons">
        <span></span>
        <div style="display:flex;gap:10px;">
          <button class="btn check-btn" id="checkBtnA" onclick="checkAnswer('asesmen')">Periksa Jawaban</button>
          <button class="btn btn-primary" id="nextBtnA" style="display:none;" onclick="nextAsesmen()">${state.asesmenIdx===ASESMEN.length-1?'Selesai & Lihat Nilai':'Soal Berikutnya'} →</button>
        </div>
      </div>
    </div>
  </div>`;
  state.asesmenAnswered=false;
}

function toggleSekolahLain(){
  const sel = document.getElementById('inpSekolah').value;
  document.getElementById('rowSekolahLain').style.display = sel==='Lain-lain' ? 'block' : 'none';
}
function startAsesmen(){
  const nama = document.getElementById('inpNama').value.trim();
  const kelas = document.getElementById('inpKelas').value;
  const sekolahPilihan = document.getElementById('inpSekolah').value;
  const sekolah = sekolahPilihan==='Lain-lain' ? document.getElementById('inpSekolahLain').value.trim() : sekolahPilihan;
  if(!nama || !kelas || !sekolah){ alert('Nama, kelas, dan nama sekolah wajib diisi terlebih dahulu.'); return; }
  state.student = {nama, kelas, sekolah};
  state.asesmenStarted = true;
  state.asesmenIdx = 0;
  state.asesmenAnswers = [];
  state.asesmenDone = false;
  renderAsesmen();
}

function nextAsesmen(){
  if(state.asesmenIdx < ASESMEN.length-1){
    state.asesmenIdx++;
    renderAsesmen();
  } else {
    state.asesmenDone = true;
    finalizeAsesmen();
  }
}

function finalizeAsesmen(){
  const correctCount = state.asesmenAnswers.filter(a=>a && a.correct).length;
  const score = Math.round(correctCount/ASESMEN.length*100);
  state.asesmenScore = score;
  saveAsesmenRecord(score, correctCount);
  renderAsesmenResult();
}

function renderAsesmenResult(){
  const byLevel = {L1:{c:0,t:0},L2:{c:0,t:0},L3:{c:0,t:0}};
  ASESMEN.forEach((q,i)=>{ byLevel[q.level].t++; if(state.asesmenAnswers[i] && state.asesmenAnswers[i].correct) byLevel[q.level].c++; });
  stage.innerHTML = `
  <div class="section">
    <div class="result-hero">
      <div style="font-size:14px;opacity:.8;">Nilai Asesmen Sumatif — ${state.student.nama}, Kelas ${state.student.kelas} — ${state.student.sekolah}</div>
      <div class="score">${state.asesmenScore}</div>
      <div style="font-size:15px;opacity:.9;">${state.asesmenAnswers.filter(a=>a&&a.correct).length} dari ${ASESMEN.length} jawaban benar</div>
    </div>
    <div class="rangkuman-grid" style="margin-top:22px;">
      <div class="rk-card"><h4>Level 1 (Recall)</h4><p>${byLevel.L1.c} / ${byLevel.L1.t} benar</p></div>
      <div class="rk-card"><h4>Level 2 (Aplikasi)</h4><p>${byLevel.L2.c} / ${byLevel.L2.t} benar</p></div>
      <div class="rk-card"><h4>Level 3 (Analisis/HOTS)</h4><p>${byLevel.L3.c} / ${byLevel.L3.t} benar</p></div>
    </div>
    <div class="nav-buttons" style="margin-top:24px;">
      <button class="btn btn-ghost" onclick="downloadCsv()">⬇ Unduh Hasil (CSV)</button>
      <button class="btn btn-primary" onclick="goTo('rangkuman')">Lanjut ke Rangkuman →</button>
    </div>
  </div>`;
}

function downloadCsv(){
  let rows = [['Nama','Kelas','Nama Sekolah','Nomor Soal','Level','Jawaban Benar (1/0)']];
  state.asesmenAnswers.forEach((a,i)=>{
    rows.push([state.student.nama, state.student.kelas, state.student.sekolah, i+1, ASESMEN[i].level, a && a.correct ? 1 : 0]);
  });
  rows.push(['','','','Total Skor', state.asesmenScore]);
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Asesmen_Elektrokimia_${state.student.nama.replace(/\\s+/g,'_')}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function saveAsesmenRecord(score, correctCount){
  try{
    const key = 'asesmen:' + Date.now() + '_' + state.student.nama.replace(/[^a-zA-Z0-9]/g,'').slice(0,30);
    const record = {nama:state.student.nama, kelas:state.student.kelas, sekolah:state.student.sekolah, skor:score, benar:correctCount, total:ASESMEN.length, waktu:new Date().toLocaleString('id-ID')};
    if(window.storage && window.storage.set){
      await window.storage.set(key, JSON.stringify(record), true);
    }
  }catch(e){ console.error('Gagal menyimpan rekap:', e); }
}

let recapOpen = false;
async function toggleRecap(){
  recapOpen = !recapOpen;
  const area = document.getElementById('recapArea');
  if(!recapOpen){ area.innerHTML=''; return; }
  area.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">Memuat rekap...</p>';
  try{
    const list = await window.storage.list('asesmen:', true);
    if(!list || !list.keys || list.keys.length===0){ area.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">Belum ada data asesmen yang masuk.</p>'; return; }
    const records = [];
    for(const k of list.keys){
      try{ const r = await window.storage.get(k, true); if(r) records.push(JSON.parse(r.value)); }catch(e){}
    }
    records.sort((a,b)=> (b.waktu||'').localeCompare(a.waktu||''));
    area.innerHTML = `<p style="font-size:12px;color:var(--ink-soft);margin-top:10px;">Data di bawah ini tersimpan bersama (shared) dan dapat dilihat oleh siapa pun yang membuka modul ini.</p>
    <table class="recap-table"><tr><th>Nama</th><th>Kelas</th><th>Sekolah</th><th>Skor</th><th>Benar</th><th>Waktu</th></tr>
    ${records.map(r=>`<tr><td>${r.nama}</td><td>${r.kelas}</td><td>${r.sekolah||'-'}</td><td>${r.skor}</td><td>${r.benar}/${r.total}</td><td>${r.waktu}</td></tr>`).join('')}
    </table>`;
  }catch(e){
    area.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">Rekap belum tersedia di perangkat ini.</p>';
  }
}

  </div>`;

function toggleSekolahLainRefleksi(){
  const sel = document.getElementById('refSekolah').value;
  document.getElementById('rowSekolahLainRef').style.display = sel==='Lain-lain' ? 'block' : 'none';
}

async function submitRefleksi(){
  const nama = document.getElementById('refNama').value.trim();
  const kelas = document.getElementById('refKelas').value;
  const sekolahPilihan = document.getElementById('refSekolah').value;
  const sekolah = sekolahPilihan==='Lain-lain' ? document.getElementById('refSekolahLain').value.trim() : sekolahPilihan;
  const teks = document.getElementById('refText').value.trim();
  if(!nama || !kelas || !sekolah || !teks){ alert('Nama, kelas, nama sekolah, dan refleksi wajib diisi terlebih dahulu.'); return; }
  try{
    const key = 'refleksi:' + Date.now() + '_' + nama.replace(/[^a-zA-Z0-9]/g,'').slice(0,30);
    const record = {nama, kelas, sekolah, teks, waktu:new Date().toLocaleString('id-ID')};
    if(window.storage && window.storage.set){
      await window.storage.set(key, JSON.stringify(record), true);
    }
    document.getElementById('refText').value='';
    document.getElementById('refNama').value='';
    document.getElementById('refKelas').value='';
    document.getElementById('refSekolah').value='';
    document.getElementById('rowSekolahLainRef').style.display='none';
    loadRefleksiFeed();
  }catch(e){
    alert('Refleksi belum dapat dikirim saat ini. Silakan coba lagi.');
  }
}

async function loadRefleksiFeed(){
  const feed = document.getElementById('refleksiFeed');
  if(!feed) return;
  try{
    const list = await window.storage.list('refleksi:', true);
    if(!list || !list.keys || list.keys.length===0){ feed.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">Belum ada refleksi yang masuk. Jadilah yang pertama menulis!</p>'; return; }
    const records = [];
    for(const k of list.keys){
      try{ const r = await window.storage.get(k, true); if(r) records.push(JSON.parse(r.value)); }catch(e){}
    }
    records.sort((a,b)=> (b.waktu||'').localeCompare(a.waktu||''));
    feed.innerHTML = records.map(r=>`
      <div class="reflect-card">
        <div class="rf-head">
          <span class="rf-name">${r.nama} &middot; Kelas ${r.kelas}</span>
          <span class="rf-meta">${r.sekolah||''} &middot; ${r.waktu||''}</span>
        </div>
        <p class="rf-text">${r.teks}</p>
      </div>`).join('');
  }catch(e){
    feed.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">Refleksi belum tersedia di perangkat ini.</p>';
  }
}

      <div class="rk-card"><h4>Tips Mengerjakan Soal</h4><p>Selalu identifikasi mana anode/katode terlebih dahulu, cek nilai E° untuk menentukan arah reaksi spontan, dan gunakan satuan yang konsisten pada perhitungan Hukum Faraday.</p></div>
    </div>
    <div class="nav-buttons" style="margin-top:26px;"><button class="btn btn-ghost" onclick="goHome()">← Kembali ke Beranda</button><button class="btn btn-primary" onclick="goTo('refleksi')">Tulis Refleksi →</button></div>
  </div>`;
}
